<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>p5.geo mobile check</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
  <script src="../../dist/p5.geo.js"></script>
  <style>
    html, body { margin: 0; overflow: hidden; }
    #panel {
      position: fixed; top: 8px; left: 8px; z-index: 10; max-width: calc(100vw - 32px);
      padding: 8px; background: rgba(255, 255, 255, 0.9); border-radius: 6px;
      font: 13px/1.5 system-ui, sans-serif;
    }
    #panel a { margin-right: 10px; }
    #panel a.current { font-weight: bold; text-decoration: none; color: black; }
  </style>
</head>
<body>
  <div id="panel">
    <div>
      <a href="?">1. normal</a>
      <a href="?drag=false">2. mouseDragged false</a>
      <a href="?pressed=false">3. mousePressed false</a>
    </div>
    <div id="status"></div>
  </div>
  <script src="mobile.js"></script>
</body>
</html>
